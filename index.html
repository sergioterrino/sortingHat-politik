<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="./static/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SortingHat - politik</title>
    <link href="./static/output.css" rel="stylesheet">
    <style>
        .range-wrapper {
            display: flex;
            align-items: center;
        }

        .range-input {
            margin: 0 10px;
        }

        .range-value {
            width: 30px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="w-full p-4 px-0 pt-3 md:px-18 lg:mx-18 xl:px-28 flex flex-col justify-center">
        <nav class="flex justify-between items-center px-2">
            <a href="/">
                <div class="flex w-40">
                    <img src="./static/hat.png" class="w-24" />
                    <img src="./static/sortingHat.png" class="relative right-4 " />
                </div>
            </a>
            <div class="text-center">
                <h3 class="text-sm">Created by</h3>
                <h1 class="text-md font-bold">Sergio Terrino</h1>
            </div>
        </nav>
        <form id="survey-form" class="bg-transparent p-6 rounded-lg shadow-md">
            <div id="questions-container"></div>
            <div class="mx-auto text-center mt-4">
                <button type="submit" class="py-3 mt-2 font-bold rounded-xl w-full bg-violet-900 hover:bg-violet-950">
                    Enviar
                </button>
            </div>
        </form>
    </div>

    <script>
        const questions = [
            "El Estado debería redistribuir más riqueza para reducir la desigualdad social.",
            "La economía debería funcionar más con libertad de mercado y menos con intervención pública.",
            "La sanidad, la educación y otros servicios esenciales deberían ser mayoritariamente públicos.",
            "Las empresas estratégicas y los servicios esenciales deberían estar más controlados por el Estado.",
            "La libertad individual y la diversidad deben primar por encima de las normas morales tradicionales.",
            "La familia, la tradición y el orden social deberían tener más peso en la política.",
            "La igualdad de género y los derechos civiles deben avanzar más rápidamente.",
            "La seguridad y el orden público deberían tener prioridad ante otras consideraciones sociales.",
            "Las regiones con identidad propia deberían poder decidir más sobre su futuro político.",
            "España debería priorizar la identidad nacional y la cultura propia en políticas migratorias y sociales.",
            "España debe recuperar más soberanía frente a decisiones de la Unión Europea.",
            "La diversidad cultural y la pluralidad social deben priorizarse por encima de la identidad nacional."
        ];

        const questionsContainer = document.getElementById('questions-container');

        questions.forEach((question, index) => {
            const questionDiv = document.createElement('div');
            questionDiv.className = 'text-center rounded-xl p-4 pb-5 bg-cyan-950 mb-2';

            const questionLabel = document.createElement('h3');
            questionLabel.className = 'text-center text-lg font-semibold mx-2 mb-6';
            questionLabel.textContent = question;
            questionDiv.appendChild(questionLabel);

            const rangeWrapper = document.createElement('div');
            rangeWrapper.className = 'range-wrapper flex justify-center';

            const rangeInput = document.createElement('input');
            rangeInput.type = 'range';
            rangeInput.min = '1';
            rangeInput.max = '10';
            rangeInput.value = '5';
            rangeInput.className = 'range-input';
            rangeInput.name = `question${index}`;
            rangeInput.oninput = function () {
                rangeValue.textContent = rangeInput.value;
            };
            rangeWrapper.appendChild(rangeInput);

            const rangeValue = document.createElement('div');
            rangeValue.className = 'range-value';
            rangeValue.textContent = '5';
            rangeWrapper.appendChild(rangeValue);

            questionDiv.appendChild(rangeWrapper);
            questionsContainer.appendChild(questionDiv);
        });

        document.getElementById('survey-form').onsubmit = async function (event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const results = [];
            for (let [key, value] of formData.entries()) {
                results.push(parseInt(value));
            }
            const response = await fetch('/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ results })
            });
            if (response.ok) {
                const html = await response.text();
                document.open();
                document.write(html);
                document.close();
            } else {
                console.error('Error submitting survey');
            }
        };
    </script>
</body>

</html>
